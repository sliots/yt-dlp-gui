name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *"          # 每日 UTC 00:00，跟随 yt-dlp nightly 更新
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 2.0.0), leave empty for 'latest' only"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TAGS="nightly,latest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="${{ github.event.inputs.version }}"
            [[ -z "$TAGS" ]] && TAGS="latest"
          else
            TAGS="${GITHUB_REF_NAME#v},latest"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          for t in ${TAGS//,/ }; do echo "${IMG}:${t}" >> "$GITHUB_OUTPUT"; done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
