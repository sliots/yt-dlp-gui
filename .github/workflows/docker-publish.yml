name: Build and Push Docker Image
run-name: ${{ inputs.ytdlp_version && format('Build yt-dlp {0}', inputs.ytdlp_version) || 'Build and Push Docker Image' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 3.0.0), leave empty for nightly only"
        required: false
      ytdlp_version:
        description: "Official yt-dlp nightly tag; empty uses the Dockerfile pin"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff check app tests
      - run: uv run pyright app
      - run: uv run pytest -q
      - run: uv run pip-audit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

      - name: Resolve yt-dlp version
        id: ytdlp
        env:
          REQUESTED_VERSION: ${{ inputs.ytdlp_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$REQUESTED_VERSION" ]]; then
            exit 0
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{6}$ ]]; then
            echo "Invalid official nightly tag" >&2
            exit 1
          fi
          gh api "repos/yt-dlp/yt-dlp-nightly-builds/releases/tags/$REQUESTED_VERSION" > "$RUNNER_TEMP/ytdlp-release.json"
          jq -e --arg version "$REQUESTED_VERSION" '.tag_name == $version and .draft == false and any(.assets[]; .name == "yt-dlp_linux" and .state == "uploaded")' "$RUNNER_TEMP/ytdlp-release.json"
          echo "build_args=YTDLP_VERSION=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          printf 'yt-dlp nightly: `%s`\n' "$REQUESTED_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="${{ github.event.inputs.version }}"
            [[ -z "$TAGS" ]] && TAGS="nightly"
          else
            TAGS="${GITHUB_REF_NAME#v},latest"
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          for tag in ${TAGS//,/ }; do echo "${IMG}:${tag}" >> "$GITHUB_OUTPUT"; done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: ${{ steps.ytdlp.outputs.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
