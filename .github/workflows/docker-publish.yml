name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *"          # 每日 UTC 00:00，跟随 yt-dlp nightly 更新
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 2.0.0), leave empty for 'latest' only"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "list=nightly,latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ github.event.inputs.version }}"
            echo "list=${V:-latest}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${GITHUB_REF_NAME#v},latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yt-dlp-gui:${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
