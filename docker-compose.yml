services:
  yt-dlp-gui:
    build: .
    image: ghcr.io/sliots/yt-dlp-gui:local
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    volumes:
      - yt-dlp-config:/app/config
      - yt-dlp-downloads:/downloads
    environment:
      APP_TOKEN: ${APP_TOKEN:?APP_TOKEN must be set}
      TZ: Asia/Shanghai
      ENABLE_SELF_UPDATE: "false"
    depends_on:
      bgutil-provider:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "none"

volumes:
  yt-dlp-config:
  yt-dlp-downloads:
