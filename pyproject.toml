[project]
name = "yt-dlp-gui"
version = "3.0.1"
description = "Single-user yt-dlp batch download manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "playwright>=1.65.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC240"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
